<!doctype html><html><head><meta charset="utf-8"><title>Game balance</title>
<style>body{font:13px/1.6 ui-monospace,Menlo,monospace;padding:16px}
.good{color:#0a7d32}.bad{color:#c0211a;font-weight:bold}h2{font:bold 15px system-ui;margin:16px 0 4px}</style>
</head><body><div id="out">running…</div>
<!-- A dev page always wants the engine as it is on disk, never the copy the
     browser kept from five minutes ago. -->
<script>document.write(["story", "memory", "effects", "arcade"]
  .map(n => "<scr" + "ipt src=\"engine/" + n + ".js?dev=" + Date.now() + "\"></scr" + "ipt>").join(""));</script>
<script>
const out = [];
try {
function trial(game, items, drive, maxFrames, extra) {
  const mount = document.createElement("div"); mount.style.display = "none"; document.body.appendChild(mount);
  let won = null, frames = 0;
  Arcade.play(game, Object.assign({ mount, items: new Set(items), frames: maxFrames, quiet: true,
    drive: (st, i) => { frames = i; drive(st, i); },
    onDone: (w) => { if (won === null) won = w; } }, extra || {}));
  mount.remove();
  return { won, seconds: (frames / 60).toFixed(1) };
}
const swim = (st) => {
  const g = st.g; if (!g || typeof g.depth !== "number") return;
  st.keys.arrowup = true;
  const near = (g.bullets || []).concat(g.bits || []).map(b => ({ dx: b.x - g.x, dy: b.y - g.y }))
    .filter(b => Math.abs(b.dy) < 44 && Math.abs(b.dx) < 44).sort((a, b) => Math.abs(a.dx) - Math.abs(b.dx))[0];
  st.keys.arrowleft = !!near && near.dx > 0;
  st.keys.arrowright = !!near && near.dx <= 0;
};
const idle = () => {};
const ring = (st) => { const g = st.g; if (!g || typeof g.angle !== "number") return;
  st.keys[" "] = Math.abs(Math.sin(g.angle)) < g.window * 0.45; };
const ringBad = (st) => { const g = st.g; if (!g) return; st.keys[" "] = (st.t * 60 | 0) % 37 === 0; };

function run(label, game, items, drive, n, extra) {
  const res = []; for (let i = 0; i < n; i++) res.push(trial(game, items, drive, 2400, extra));
  const wins = res.filter(r => r.won === true).length;
  const times = res.filter(r => r.won !== null).map(r => Number(r.seconds));
  const avg = times.length ? (times.reduce((a, b) => a + b, 0) / times.length).toFixed(1) : "—";
  const pct = Math.round(wins / n * 100);
  out.push(`<div>${label.padEnd(44)} <b>${String(pct).padStart(3)}% won</b>  (${wins}/${n}), about ${avg}s a go</div>`);
  return pct;
}
out.push("<h2>The undertow — is it winnable, and is it fair?</h2>");
const a = run("a player who swims and dodges, feather+lantern", "undertow", ["white feather","lantern"], swim, 8);
const b = run("the same player with no lantern (nearly blind)", "undertow", ["white feather"], swim, 8);
const c = run("with everything, including the fold blinks", "undertow", ["white feather","lantern","the same key twice"], swim, 8);
const d = run("somebody who does not touch the controls", "undertow", ["white feather"], idle, 8);
out.push("<h2>The bell — can you ring it, and can you fail it?</h2>");
const e = run("a player hitting the beat", "bell", ["iron clapper"], ring, 7);
const f = run("a player mashing at random", "bell", ["iron clapper"], ringBad, 7);

out.push("<h2>The duel — can Clackers win, and does catching him matter?</h2>");
Memory.forget(); Memory.caught("clackers");
const duelFoe = { creatures: ["clackers"], scene: { against: { who: "Old Molly", level: 4 } } };
const pickMove = (st) => {};                       // the duel is driven by buttons
function duelRun(label, items, creatures, level, n) {
  let wins = 0;
  for (let i = 0; i < n; i++) {
    Memory.forget();
    if (creatures.length) { Memory.caught(creatures[0]); Memory.state.creatures[creatures[0]].level = level; }
    const mount = document.createElement("div"); mount.style.display = "none"; document.body.appendChild(mount);
    let won = null;
    Arcade.play("duel", { mount, items: new Set(items), creatures, quiet: true,
      scene: { against: { who: "Old Molly", level: 4 } }, onDone: (w) => { if (won === null) won = w; } });
    // a player who always picks the best move available, 60 rounds at most
    const moves = [...mount.querySelectorAll(".arcade-move")];
    for (let turn = 0; turn < 60 && won === null; turn++) {
      const live = moves.filter(b => !b.disabled);
      (live[live.length - 1] || moves[0]).click();
      for (let f = 0; f < 160 && won === null; f++) { Arcade._tick(mount, 1 / 60); }
    }
    if (won === true) wins++;
    mount.remove();
  }
  const pct = Math.round(wins / n * 100);
  out.push(`<div>${label.padEnd(44)} <b>${String(pct).padStart(3)}% won</b>  (${wins}/${n})</div>`);
  return pct;
}
const g1 = duelRun("Clackers at level 1, no button", [], ["clackers"], 1, 14);
const g3 = duelRun("Clackers at level 3, no button", [], ["clackers"], 3, 14);
const gb = duelRun("Clackers at level 3, with the button", ["a brass button"], ["clackers"], 3, 14);

out.push("<h2>The clicker — can the tower be finished?</h2>");
function clickRun(label, items, creatures, clicksPerSecond, maxSeconds) {
  const mount = document.createElement("div"); mount.style.display = "none"; document.body.appendChild(mount);
  let won = null, frames = 0;
  const every = Math.max(1, Math.round(60 / clicksPerSecond));
  Arcade.play("clicker", { mount, items: new Set(items), creatures, quiet: true, frames: maxSeconds * 60,
    drive: (st, i) => {
      frames = i;
      st.pointer.down = (i % every) < 1;
      st.pointer.x = 240; st.pointer.y = 200;
      if (i % 30 === 0 && st.g.shopButtons) {          // buy whatever you can afford
        for (const b of st.g.shopButtons) if (!b.disabled) { b.click(); break; }
      }
    },
    onDone: (w) => { if (won === null) won = w; } });
  mount.remove();
  const secs = (frames / 60).toFixed(0);
  out.push(`<div>${label.padEnd(44)} <b>${won ? "finished" : "did not finish"}</b> in ${secs}s</div>`);
  return { won, secs: Number(secs) };
}
const c1 = clickRun("clicking about 5 a second, buying as you go", [], [], 5, 200);
const c2 = clickRun("the same, with the lantern and Clackers", ["lantern"], ["clackers"], 5, 200);
const c3 = clickRun("one click, then nothing but waiting", [], [], 0.02, 200);

out.push("<h2>Verdict</h2>");
const check = (c2, m) => out.push(`<div class="${c2 ? "good" : "bad"}">${c2 ? "PASS" : "FAIL"}  ${m}</div>`);
check(a >= 50, "the undertow can be won by a player who swims and dodges (" + a + "%)");
check(d <= 25, "and is lost by one who doesn't, so winning means something (" + d + "%)");
check(c >= 50, "carrying more never makes it harder (" + c + "%)");
check(e >= 60, "the bell rings for a player on the beat (" + e + "%)");
check(f < e, "and mashing is worse than playing (" + f + "% vs " + e + "%)");
check(g3 >= 25, "a levelled crab can take Old Molly, at least sometimes (" + g3 + "%)");
check(g3 > g1, "and levelling up is what did it (" + g1 + "% at level 1 vs " + g3 + "% at level 3)");
check(gb >= g3, "and the brass button move is worth having (" + gb + "% vs " + g3 + "%)");

check(c1.won && c1.secs <= 180, "the sand tower can be finished by hand (" + c1.secs + "s)");
check(c2.won && c2.secs <= c1.secs, "and the lantern and the crab make it quicker (" + c2.secs + "s)");
check(!c3.won, "but it will not build itself if you walk away");
out.push(`<div style="margin-top:12px;max-width:70ch;color:#444">
<b>What this does and does not measure.</b> The player here is a bot that reads
every hazard's exact position every frame and never panics. It is better than
a person, and the darkness costs it nothing, so these numbers are an
<b>upper bound</b>, not a difficulty setting. What they do prove is that both
games can be won, that neither can be won by doing nothing, and that the bell
is reachable at all &mdash; it was not, until the fade was moved to run before
the hit instead of after it.</div>`);
} catch (err) {
  out.push(`<div class="bad">THREW: ${err && err.message}</div><pre>${err && err.stack}</pre>`);
}
document.getElementById("out").innerHTML = out.join("");
</script></body></html>
