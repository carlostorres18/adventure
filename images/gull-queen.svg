<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img">
  <title>A large white gull sitting in a nest of driftwood, wearing a tiny golden crown, with hundreds of pale eyes watching from the dark behind her</title>
  <defs>
    <radialGradient id="gq-dark" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#1a1b22"/><stop offset="1" stop-color="#05060a"/>
    </radialGradient>
    <radialGradient id="gq-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.28"/><stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gq-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6416"/><stop offset="0.45" stop-color="#f5d873"/><stop offset="0.55" stop-color="#fffbe6"/><stop offset="1" stop-color="#8a6416"/>
    </linearGradient>
    <style>
      .eye   { animation: gq-blink 7s steps(1,end) infinite; }
      .lid   { animation: gq-lid 5.5s ease-in-out infinite; transform-origin: center top; }
      .glint { animation: gq-glint 6s ease-in-out infinite; }
      .breath{ animation: gq-breath 5s ease-in-out infinite; transform-origin: 300px 230px; }
      .lamp  { animation: gq-flicker 3.4s ease-in-out infinite; }
      @keyframes gq-blink   { 0%,90% { opacity: 0.7; } 91%,95% { opacity: 0.05; } 96%,100% { opacity: 0.7; } }
      @keyframes gq-lid     { 0%,76% { transform: scaleY(0); } 80%,84% { transform: scaleY(1); } 88%,100% { transform: scaleY(0); } }
      @keyframes gq-glint   { 0%,100% { transform: translateX(-26px) skewX(-12deg); opacity: 0; } 45%,55% { opacity: 0.95; } 90% { transform: translateX(26px) skewX(-12deg); opacity: 0; } }
      @keyframes gq-breath  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.012); } }
      @keyframes gq-flicker { 0%,100% { opacity: 1; } 30% { opacity: 0.82; } 64% { opacity: 0.95; } }
      @media (prefers-reduced-motion: reduce) { .eye,.lid,.glint,.breath,.lamp { animation: none; } }
    </style>
  </defs>

  <rect width="640" height="300" fill="url(#gq-dark)"/>

  <!-- the watchers -->
  <g fill="#ddd8c2">
    <circle class="eye" cx="54"  cy="62"  r="2.4"/><circle class="eye" cx="96"  cy="40"  r="1.9" style="animation-delay:-1.1s"/>
    <circle class="eye" cx="142" cy="78"  r="2.2" style="animation-delay:-2.4s"/><circle class="eye" cx="38"  cy="128" r="2"   style="animation-delay:-3.7s"/>
    <circle class="eye" cx="112" cy="162" r="2.5" style="animation-delay:-0.5s"/><circle class="eye" cx="66"  cy="208" r="1.8" style="animation-delay:-5.2s"/>
    <circle class="eye" cx="168" cy="36"  r="2.1" style="animation-delay:-4.4s"/><circle class="eye" cx="206" cy="96"  r="1.7" style="animation-delay:-2.9s"/>
    <circle class="eye" cx="498" cy="54"  r="2.3" style="animation-delay:-0.8s"/><circle class="eye" cx="546" cy="92"  r="2"   style="animation-delay:-3.1s"/>
    <circle class="eye" cx="592" cy="48"  r="2.4" style="animation-delay:-1.9s"/><circle class="eye" cx="604" cy="146" r="1.9" style="animation-delay:-4.9s"/>
    <circle class="eye" cx="458" cy="110" r="1.8" style="animation-delay:-6.1s"/><circle class="eye" cx="562" cy="190" r="2.2" style="animation-delay:-2.2s"/>
    <circle class="eye" cx="24"  cy="164" r="1.6" style="animation-delay:-5.8s"/><circle class="eye" cx="624" cy="212" r="1.7" style="animation-delay:-3.4s"/>
    <circle class="eye" cx="178" cy="212" r="2"   style="animation-delay:-1.4s"/><circle class="eye" cx="436" cy="208" r="1.9" style="animation-delay:-6.6s"/>
  </g>

  <ellipse cx="320" cy="180" rx="210" ry="130" fill="url(#gq-glow)" class="lamp"/>

  <!-- nest -->
  <g stroke="#6b5a42" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M214 258 q106 -34 212 0"/><path d="M226 272 q94 -28 188 0"/>
    <path d="M238 250 l-26 16"/><path d="M402 250 l26 16"/><path d="M276 246 l-18 22"/><path d="M364 246 l18 22"/>
  </g>
  <g stroke="#8b7554" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M250 262 q70 -18 140 0"/><path d="M300 244 l-40 12"/><path d="M340 244 l40 12"/>
  </g>

  <!-- the queen -->
  <g class="breath">
    <path d="M320 248 q-70 2 -72 -32 q-2 -38 40 -54 q16 -24 40 -22 q30 2 34 30 q30 20 28 48 q-2 30 -70 30 Z" fill="#f4f2e8"/>
    <path d="M300 170 q46 -18 78 10 q16 34 -8 58 q-36 10 -70 -8 q-14 -30 0 -60 Z" fill="#dcdacd"/>
    <path d="M356 164 q34 16 34 50 q-4 24 -26 30 q22 -36 -8 -80 Z" fill="#c9c6b6"/>
    <path d="M268 198 q44 -22 92 -6 q-30 34 -84 28 q-12 -10 -8 -22 Z" fill="#e4e1d3"/>
    <path d="M268 198 q44 -22 92 -6" stroke="#b9b6a6" stroke-width="2" fill="none"/>
    <path d="M250 224 q-32 10 -46 24 q34 2 58 -10 Z" fill="#d8d5c6"/>
    <path d="M204 248 l18 -4 M206 244 l16 -2" stroke="#9c9a8c" stroke-width="2" stroke-linecap="round"/>
    <!-- head, beak, eye -->
    <path d="M330 142 q24 -4 28 18 q2 16 -14 20 q-20 2 -22 -16 q-2 -18 8 -22 Z" fill="#fbfaf3"/>
    <path d="M356 158 l26 7 l-26 8 Z" fill="#e8a13a"/>
    <circle cx="344" cy="156" r="3.6" fill="#15161a"/>
    <circle cx="345.4" cy="154.8" r="1.1" fill="#ffffff" opacity="0.9"/>
    <path class="lid" d="M337 150 q8 -4 15 2 l0 7 q-8 4 -15 -2 Z" fill="#f0eee2"/>
    <!-- crown -->
    <g>
      <path d="M326 134 L330 122 L336 130 L342 118 L348 130 L354 122 L358 134 Z" fill="url(#gq-gold)" stroke="#6d4e10" stroke-width="1"/>
      <rect x="326" y="133" width="32" height="5" rx="2" fill="url(#gq-gold)" stroke="#6d4e10" stroke-width="0.8"/>
      <circle cx="342" cy="118" r="2" fill="#fff6cf"/>
      <rect class="glint" x="330" y="120" width="5" height="19" fill="#ffffff"/>
    </g>
  </g>
  <ellipse cx="320" cy="284" rx="130" ry="10" fill="#000" opacity="0.5"/>
</svg>
