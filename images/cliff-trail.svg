<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img">
  <title>A narrow trail along a cliff above a grey sea, with wind driving fog past and gulls wheeling</title>
  <defs>
    <linearGradient id="ct-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20283f"/><stop offset="0.55" stop-color="#5d617f"/><stop offset="1" stop-color="#b9a0a0"/>
    </linearGradient>
    <linearGradient id="ct-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#45566f"/><stop offset="1" stop-color="#1b2330"/>
    </linearGradient>
    <linearGradient id="ct-rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4535"/><stop offset="1" stop-color="#2a271f"/>
    </linearGradient>
    <style>
      .fog   { animation: ct-drift 14s linear infinite; }
      .fog.b { animation-duration: 22s; animation-delay: -6s; }
      .fog.c { animation-duration: 9s;  animation-delay: -3s; }
      .streak{ animation: ct-streak 1.6s linear infinite; }
      .streak.b { animation-duration: 2.3s; animation-delay: -0.6s; }
      .streak.c { animation-duration: 1.2s; animation-delay: -0.9s; }
      .gull  { animation: ct-wheel 11s ease-in-out infinite; transform-origin: 300px 110px; }
      .gull.b{ animation-duration: 15s; animation-delay: -4s; transform-origin: 220px 80px; }
      .gull.c{ animation-duration: 8s;  animation-delay: -2s; transform-origin: 420px 130px; }
      .wing  { animation: ct-flap 0.9s ease-in-out infinite; transform-origin: center; }
      .wing.b{ animation-duration: 1.2s; }
      .wing.c{ animation-duration: 0.7s; }
      .grass { animation: ct-lean 2.8s ease-in-out infinite; transform-origin: bottom; }
      @keyframes ct-drift  { from { transform: translateX(-180px); } to { transform: translateX(640px); } }
      @keyframes ct-streak { from { stroke-dashoffset: 0; opacity: 0; } 20% { opacity: 0.55; } to { stroke-dashoffset: -260; opacity: 0; } }
      @keyframes ct-wheel  { 0%,100% { transform: rotate(-9deg) translateY(0); } 50% { transform: rotate(9deg) translateY(-14px); } }
      @keyframes ct-flap   { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
      @keyframes ct-lean   { 0%,100% { transform: skewX(-14deg); } 50% { transform: skewX(-26deg); } }
      @media (prefers-reduced-motion: reduce) { .fog,.streak,.gull,.wing,.grass { animation: none; } }
    </style>
  </defs>

  <rect width="640" height="300" fill="url(#ct-sky)"/>
  <g fill="#cfd4e0" opacity="0.16">
    <ellipse class="fog"   cx="0" cy="96"  rx="150" ry="17"/>
    <ellipse class="fog b" cx="0" cy="142" rx="210" ry="13"/>
    <ellipse class="fog c" cx="0" cy="62"  rx="110" ry="9"/>
  </g>

  <rect y="196" width="640" height="104" fill="url(#ct-sea)"/>
  <path d="M0 202 Q70 196 140 202 T280 202 T420 202 T560 202 T700 202" stroke="#8c9db8" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M0 232 Q80 225 160 232 T320 232 T480 232 T640 232" stroke="#8c9db8" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- rocks in the surf -->
  <g fill="#1a1f29">
    <path d="M60 246 L84 216 L108 246 Z"/><path d="M118 252 L134 230 L152 252 Z"/><path d="M12 258 L30 238 L50 258 Z"/>
  </g>
  <g fill="#e8eef5" opacity="0.5">
    <ellipse cx="84" cy="246" rx="26" ry="5"/><ellipse cx="134" cy="252" rx="20" ry="4"/>
  </g>

  <!-- the cliff, trail cut along its face -->
  <path d="M330 300 L340 150 L400 96 L470 72 L560 58 L640 54 L640 300 Z" fill="url(#ct-rock)"/>
  <path d="M330 300 L340 150 L400 96 L470 72 L560 58 L640 54 L640 70 L560 76 L470 92 L404 118 L356 168 L352 300 Z" fill="#5c5542"/>
  <path d="M352 300 L356 168 L404 118 L470 92 L560 76 L640 70 L640 86 L556 94 L468 110 L414 136 L376 182 L374 300 Z" fill="#7a7158" opacity="0.75"/>
  <!-- the trail itself: a pale ledge -->
  <path d="M374 300 L376 182 L414 136 L468 110 L556 94 L640 86" stroke="#c9bf9e" stroke-width="7" fill="none" stroke-linejoin="round" opacity="0.9"/>
  <path d="M374 300 L376 182 L414 136 L468 110 L556 94 L640 86" stroke="#3b3528" stroke-width="1.5" fill="none" stroke-linejoin="round" opacity="0.6"/>

  <!-- grass on the clifftop, leaning hard in the wind -->
  <g stroke="#6f7a54" stroke-width="2.5" stroke-linecap="round">
    <path class="grass" d="M450 104 L446 86"/><path class="grass" d="M500 96 L495 76" style="animation-delay:-0.5s"/>
    <path class="grass" d="M548 88 L543 68" style="animation-delay:-1.1s"/><path class="grass" d="M600 84 L596 64" style="animation-delay:-1.7s"/>
  </g>

  <!-- wind -->
  <g stroke="#e7ecf4" fill="none" stroke-linecap="round" stroke-width="2">
    <path class="streak"   d="M640 120 q-110 -14 -220 6 t-220 -4" stroke-dasharray="60 200"/>
    <path class="streak b" d="M640 164 q-130 10 -250 -8 t-200 10"  stroke-dasharray="40 220"/>
    <path class="streak c" d="M640 76  q-100 -10 -190 4"           stroke-dasharray="30 230"/>
  </g>

  <!-- gulls -->
  <g fill="none" stroke="#f2f0e6" stroke-width="2.5" stroke-linecap="round">
    <g class="gull"><g class="wing"><path d="M290 112 q9 -9 18 0 q9 -9 18 0"/></g></g>
    <g class="gull b"><g class="wing b"><path d="M208 82 q7 -7 14 0 q7 -7 14 0"/></g></g>
    <g class="gull c"><g class="wing c"><path d="M412 132 q6 -6 12 0 q6 -6 12 0"/></g></g>
  </g>
</svg>
